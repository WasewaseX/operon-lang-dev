id: conventional-mutex-unwrap
message: 'v2.4.0 policy: no poisoning unwraps — use .lock().unwrap_or_else(|e| e.into_inner()); all 8 former sites were converted (TRIAGE.md). Any match here is a regression.'
severity: warning
language: Rust
rule:
  pattern: $A.lock().unwrap()
paths:
  include:
    - src
