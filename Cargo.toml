[package]
name = "operon"
version = "2.9.3"
edition = "2021"
license = "MIT"
description = "Operon — the gene-expression language. Total Grammar toolchain (Rust core, C/C++ load-bearing kernels)."
repository = "https://github.com/WasewaseX/operon-lang-dev"
readme = "README.md"
keywords = ["language", "interpreter", "compiler"]
categories = ["compilers"]

[lib]
name = "operon"
path = "src/lib.rs"

[[bin]]
name = "operon"
path = "src/main.rs"

[build-dependencies]
cc = "1"

# ai/ecosystem item 10 (release distribution): the default build stays
# zero-external-crates; `--features tls` adds a pure-Rust TLS stack so the
# package client can dial https registries (Render serves https at the edge).
[dependencies]
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
# dx-r1 (audit W13): stripped release binaries (measured 1.6 MB on linux x64)
strip = true

# W61 (ROADMAP-100): distribution metadata — community drafts, inert to
# cargo build. CI-validated when a packaging job lands (see docs/PACKAGING.md).
# The tables are independent by design.
# cargo-binstall (W061-A): the B5 stack merged 2026-09-27 WITHOUT this table
# reaching main (its Cargo.toml delta stayed on the stack tip) — the channel
# had silently died. Restored here; the template contract (asset naming,
# inner dir, binaries) is pinned by scripts/pkg_meta_check.py in the
# standing gate, so it can never drift behind release.yml unnoticed.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/operon-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "operon-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.deb]
maintainer = "Operon maintainers <https://github.com/WasewaseX/operon-lang-dev>"
copyright = "WasewaseX"
license-file = ["LICENSE", "0"]
extended-description = """\
Operon — the gene-expression language. A Total Grammar language where nothing \
you write is ever rejected: it wobbles, repairs, and runs. Ships the operon \
interpreter, the operon-ls language server, and the self-hosted std/ library."""
depends = "$auto"
section = "devel"
priority = "optional"
assets = [
    ["target/release/operon", "usr/bin/", "755"],
    ["target/release/operon-ls", "usr/bin/", "755"],
    ["std/*", "usr/lib/operon/std/", "644"],
    ["README.md", "usr/share/doc/operon/README", "644"],
]

[package.metadata.generate-rpm]
name = "operon-lang"
summary = "The gene-expression language — Total Grammar toolchain"
description = "Operon — the gene-expression language. A Total Grammar language where nothing you write is ever rejected: it wobbles, repairs, and runs."
license = "MIT"
group = "Development/Languages"
assets = [
    { source = "target/release/operon", dest = "/usr/bin/operon", mode = "755" },
    { source = "target/release/operon-ls", dest = "/usr/bin/operon-ls", mode = "755" },
    { source = "std/*", dest = "/usr/lib/operon/std/", mode = "644" },
]
