[package]
name = "operon"
version = "2.2.0"
edition = "2021"
license = "MIT"
description = "Operon — the gene-expression language. Total Grammar toolchain (Rust core, C/C++ load-bearing kernels)."
repository = "https://github.com/WasewaseX/operon-lang-dev"
readme = "README.md"
keywords = ["language", "interpreter", "compiler"]
categories = ["compilers"]

[lib]
name = "operon"
path = "src/lib.rs"

[[bin]]
name = "operon"
path = "src/main.rs"

[build-dependencies]
cc = "1"

# ai/ecosystem item 10 (release distribution): the default build stays
# zero-external-crates; `--features tls` adds a pure-Rust TLS stack so the
# package client can dial https registries (Render serves https at the edge).
[dependencies]
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
# dx-r1 (audit W13): stripped release binaries (measured 1.6 MB on linux x64)
strip = true
