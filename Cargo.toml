[package]
name = "operon"
version = "2.2.0"
edition = "2021"
license = "MIT"
description = "Operon — the gene-expression language. Total Grammar toolchain (Rust core, C/C++ load-bearing kernels)."
repository = "https://github.com/WasewaseX/operon-lang-dev"
readme = "README.md"
keywords = ["language", "interpreter", "compiler"]
categories = ["compilers"]

[lib]
name = "operon"
path = "src/lib.rs"

[[bin]]
name = "operon"
path = "src/main.rs"

# B5 (builder-B): cargo-binstall support. Inert metadata — cargo build ignores
# [package.metadata]. Lets any user with cargo-binstall install the prebuilt
# release binary without a compiler:
#   cargo binstall --git https://github.com/WasewaseX/operon-lang-dev operon
# Templates resolve against the GitHub release tagged v{version}; the Windows
# archive is a zip, everything else is a tar.gz. Validated with --dry-run
# against the real v2.2.0 assets (see README "Install everywhere").
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
# dx-r1 (audit W13): stripped release binaries (measured 1.6 MB on linux x64)
strip = true
