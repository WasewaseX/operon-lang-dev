# Vendored for the master-ci python job (runs `mypy --ignore-missing-imports .`).
# The repo mixes top-level modules (bootstrap/, scripts/, apps/, tests/) with
# no shared package root. Two app pairs collide on module ids (both
# apps/ytdl-*/python dirs are named `python`, both app test dirs ship a
# gen_fixture.py); mypy aborts discovery on the clash, so those four
# stand-alone app-internal tools are excluded from TYPE CHECKING (they are
# still covered by ruff, shellcheck-class hygiene and their own e2e runs).
# Everything else — including the whole differential oracle in bootstrap/ —
# is type-checked.
[mypy]
explicit_package_bases = True
namespace_packages = True
mypy_path = .
exclude = (?x)(apps/ytdl-bench/python/|apps/ytdl-compare/python/|apps/loglens/test/|apps/csvstat/test/)
