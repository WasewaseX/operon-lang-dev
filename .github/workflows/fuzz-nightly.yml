# z-fuzz-libfuzzer (#49): the W051 deeper layer — in-process coverage-guided
# libFuzzer targets on the parser/checker/evaluator surfaces. NON-BLOCKING
# at first per the issue's acceptance ("promote on soak"): findings upload
# as artifacts and feed the stage-4 triage pipeline (F4/#48 signature DB).
name: fuzz-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "seconds per target"
        default: "300"

# least privilege: nothing in this workflow writes to the repo
permissions:
  contents: read

jobs:
  libfuzzer:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0 (SHA-pinned, D-6, audit 2026-10-18)
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master snapshot (SHA-pinned, D-6, audit 2026-10-18)
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Restore corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.3.0 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build targets
        run: cargo +nightly fuzz build
      - name: fuzz_parse
        env:
          BUDGET: ${{ github.event.inputs.budget || 300 }}
        run: |
          B="$BUDGET"
          cargo +nightly fuzz run fuzz_parse -- -max_total_time="$B" -rss_limit_mb=4096 -timeout=25
      - name: fuzz_check
        env:
          BUDGET: ${{ github.event.inputs.budget || 300 }}
        run: |
          B="$BUDGET"
          cargo +nightly fuzz run fuzz_check -- -max_total_time="$B" -rss_limit_mb=4096 -timeout=25
      - name: fuzz_run (fuel-capped, leaks out of scope — process-lifetime Rc graph)
        env:
          BUDGET: ${{ github.event.inputs.budget || 300 }}
        run: |
          B="$BUDGET"
          ASAN_OPTIONS=detect_leaks=0 cargo +nightly fuzz run fuzz_run -- -max_total_time="$B" -rss_limit_mb=4096 -timeout=25 -detect_leaks=0
      - name: Upload artifacts on any finding
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          name: fuzz-findings
          path: fuzz/artifacts/
