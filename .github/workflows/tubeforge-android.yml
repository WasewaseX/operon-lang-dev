name: tubeforge-android

# TubeForge Lite for Android — the Operon-core APK.
# Builds liboperon.so (the full Operon language core) with cargo-ndk for
# arm64, compiles the JNI glue + Kotlin app with the Android SDK, signs
# with the PERMANENT TubeForge keystore (vault credentials), uploads the APK.

on:
  push:
    branches: ["**"]
    paths:
      - "labs/tubeforge-android/**"
      - "src/**"
      - ".github/workflows/tubeforge-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, D-6, audit 2026-10-18)

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA-pinned, D-6, audit 2026-10-18)
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build liboperon.so (arm64)
        working-directory: labs/tubeforge-android/operon-ffi
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@e24011a3b5db78bd5ab798036042d9312002f252 # v3.2.0 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          gradle-version: "8.7"

      - name: Restore keystore
        env:
          TF_KEYSTORE_B64: ${{ secrets.TF_KEYSTORE_B64 }}
        run: |
          if [ -n "$TF_KEYSTORE_B64" ]; then
            echo "$TF_KEYSTORE_B64" | base64 -d > /tmp/tubeforge.keystore
            echo "TF_KEYSTORE_PATH=/tmp/tubeforge.keystore" >> "$GITHUB_ENV"
            echo "TF_KEYSTORE_PASS=TFstore-2026-permanent" >> "$GITHUB_ENV"
            echo "TF_KEY_ALIAS=tubeforge" >> "$GITHUB_ENV"
            echo "TF_KEY_PASS=TFstore-2026-permanent" >> "$GITHUB_ENV"
          else
            echo "::warning::TF_KEYSTORE_B64 secret not set — APK will be unsigned"
          fi

      - name: Assemble release APK
        working-directory: labs/tubeforge-android
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        working-directory: labs/tubeforge-android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          name: tubeforge-lite-apk
          path: labs/tubeforge-android/app/build/outputs/apk/release/*.apk
