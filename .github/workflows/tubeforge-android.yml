name: tubeforge-android

# TubeForge Lite for Android — the Operon-core APK.
# Builds liboperon.so (the full Operon language core) with cargo-ndk for
# arm64, compiles the JNI glue + Kotlin app with the Android SDK, signs
# with the PERMANENT TubeForge keystore (vault credentials), uploads the APK.

on:
  push:
    branches: ["**"]
    paths:
      - "labs/tubeforge-android/**"
      - "src/**"
      - ".github/workflows/tubeforge-android.yml"
  workflow_dispatch:

# least privilege: nothing in this workflow writes to the repo
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0 (SHA-pinned, D-6, audit 2026-10-18)

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA-pinned, D-6, audit 2026-10-18)
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build liboperon.so (arm64)
        working-directory: labs/tubeforge-android/operon-ffi
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.9.1 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v3.2.0 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          gradle-version: "8.7"

      - name: Restore keystore
        env:
          TF_KEYSTORE_B64: ${{ secrets.TF_KEYSTORE_B64 }}
        run: |
          if [ -n "$TF_KEYSTORE_B64" ]; then
            echo "$TF_KEYSTORE_B64" | base64 -d > /tmp/tubeforge.keystore
            {
              echo "TF_KEYSTORE_PATH=/tmp/tubeforge.keystore"
              echo "TF_KEYSTORE_PASS=TFstore-2026-permanent"
              echo "TF_KEY_ALIAS=tubeforge"
            } >> "$GITHUB_ENV"
            echo "TF_KEY_PASS=TFstore-2026-permanent" >> "$GITHUB_ENV"
          else
            echo "::warning::TF_KEYSTORE_B64 secret not set — APK will be unsigned"
          fi

      - name: Assemble release APK
        working-directory: labs/tubeforge-android
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        working-directory: labs/tubeforge-android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | LC_ALL=C sort | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2 (SHA-pinned, D-6, audit 2026-10-18)
        with:
          name: tubeforge-lite-apk
          path: labs/tubeforge-android/app/build/outputs/apk/release/*.apk
