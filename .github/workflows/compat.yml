name: compat

# The reliability gate (docs/COMPAT.md): every push runs the differential
# harness, the 3-way VM parity gate, the compat matrix, and the fuzzer
# across OS x build-profile x word-size. Every optimization must preserve
# semantics — enforced by identical bytes from every cell of the matrix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # primary OS coverage, release profile
          - os: ubuntu-latest
            profile: release
          - os: macos-latest
            profile: release
          - os: windows-latest
            profile: release
          # build-profile axis (A4): debug vs release on the primary OS
          - os: ubuntu-latest
            profile: debug
          # word-size axis: 32-bit x86 (Linux), where usize/pointer-size
          # and long-double behaviors would surface
          - os: ubuntu-latest
            profile: release
            target: i686-unknown-linux-gnu
          - os: ubuntu-latest
            profile: release
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (32-bit / aarch64 Linux)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib
      - name: Install cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static libc6-arm64-cross
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV
          # F6/#50 (reliab lane, 2026-10-02): the cross-built aarch64 binary
          # is dynamically linked against aarch64 glibc; under qemu-user its
          # ELF interpreter (/lib/ld-linux-aarch64.so.1) must resolve inside
          # the TARGET sysroot, which an x86_64 runner does not have — every
          # program died at exec with rust=255 (qemu "Could not open"
          # the loader). libc6-arm64-cross installs the aarch64 loader under
          # /usr/aarch64-linux-gnu; QEMU_LD_PREFIX points qemu-user there.
          echo 'QEMU_LD_PREFIX=/usr/aarch64-linux-gnu' >> $GITHUB_ENV

      # r7 fix (sz, red-main hotfix): CARGO_BUILD_TARGET was exported EMPTY on
      # every non-cross leg, which cargo rejects — the whole matrix has been
      # red since introduction. The build now passes --target only when set,
      # and ALWAYS exposes the produced binary at bin/operon (the one path
      # harness.py, vm_parity.sh, compat_matrix.sh and fuzz_parser.py exec);
      # cross-built aarch64 binaries execute transparently under
      # qemu-user-static binfmt.
      - name: Build
        shell: bash
        env:
          CT: ${{ matrix.target }}
        run: |
          mkdir -p bin
          if [ -n "$CT" ]; then
            cargo build --release --target "$CT"
            cp "target/$CT/release/operon" bin/operon
          else
            cargo build --release
            if [ -f target/release/operon.exe ]; then
              cp target/release/operon.exe bin/operon.exe
            else
              cp target/release/operon bin/operon
            fi
          fi

      - name: Build (debug profile axis)
        if: matrix.profile == 'debug' && !matrix.target
        run: cargo build

      - name: Unit tests
        if: matrix.profile == 'release' && !matrix.target
        run: cargo test --release

      - name: Differential harness (Rust vs Python oracle)
        run: python3 bootstrap/harness.py

      - name: 3-way VM parity (tree-walk / vm / vm-opt)
        shell: bash
        run: bash scripts/vm_parity.sh

      - name: Compat matrix (fresh randomized programs + full corpus)
        shell: bash
        run: bash scripts/compat_matrix.sh
        env:
          GEN: "1"
          FRESH: "300"

      - name: Parser fuzzer
        shell: bash
        run: python3 scripts/fuzz_parser.py --n 500 --seed 20260930 --exec

      - name: Redteam containment
        if: matrix.profile == 'release' && !matrix.target
        shell: bash
        run: bash scripts/redteam.sh
