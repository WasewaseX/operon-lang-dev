name: compat

# The reliability gate (docs/COMPAT.md): every push runs the differential
# harness, the 3-way VM parity gate, the compat matrix, and the fuzzer
# across OS x build-profile x word-size. Every optimization must preserve
# semantics — enforced by identical bytes from every cell of the matrix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # primary OS coverage, release profile
          - os: ubuntu-latest
            profile: release
          - os: macos-latest
            profile: release
          - os: windows-latest
            profile: release
          # build-profile axis (A4): debug vs release on the primary OS
          - os: ubuntu-latest
            profile: debug
          # word-size axis: 32-bit x86 (Linux), where usize/pointer-size
          # and long-double behaviors would surface. The i686 binary runs
          # natively on the x86_64 host, so no emulation is needed.
          - os: ubuntu-latest
            profile: release
            target: i686-unknown-linux-gnu
          # arch axis: aarch64. compat-r2 (2026-10-03): this leg used to
          # CROSS-compile on the x86_64 runner and execute under qemu-user
          # binfmt — that never actually ran (3484/3484 programs diverged
          # with rust=255, '<missing>' output on every target; binfmt was
          # not registering on the runner). The leg now runs on the native
          # arm runner, the same one release.yml builds its aarch64 target
          # on — real bytes, real execution, no emulation dependency.
          - os: ubuntu-24.04-arm
            profile: release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain (32-bit Linux)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      # r7 fix (sz, red-main hotfix): CARGO_BUILD_TARGET was exported EMPTY on
      # every non-cross leg, which cargo rejects — the whole matrix has been
      # red since introduction. The build now passes --target only when set,
      # and ALWAYS exposes the produced binary at bin/operon (the one path
      # harness.py, vm_parity.sh, compat_matrix.sh and fuzz_parser.py exec).
      # compat-r2: the aarch64 caveat below is RETIRED — that leg is native
      # arm now (see the matrix note); no cross toolchain, no qemu.
      - name: Build
        shell: bash
        env:
          CT: ${{ matrix.target }}
        run: |
          mkdir -p bin
          if [ -n "$CT" ]; then
            cargo build --release --target "$CT"
            cp "target/$CT/release/operon" bin/operon
          else
            cargo build --release
            if [ -f target/release/operon.exe ]; then
              cp target/release/operon.exe bin/operon.exe
            else
              cp target/release/operon bin/operon
            fi
          fi

      - name: Build (debug profile axis)
        if: matrix.profile == 'debug' && !matrix.target
        run: cargo build

      - name: Unit tests
        if: matrix.profile == 'release' && !matrix.target
        run: cargo test --release

      - name: Differential harness (Rust vs Python oracle)
        run: python3 bootstrap/harness.py

      - name: 3-way VM parity (tree-walk / vm / vm-opt)
        shell: bash
        run: bash scripts/vm_parity.sh

      - name: Compat matrix (fresh randomized programs + full corpus)
        shell: bash
        run: bash scripts/compat_matrix.sh
        env:
          GEN: "1"
          FRESH: "300"

      - name: Parser fuzzer
        if: matrix.target != 'i686-unknown-linux-gnu'
        shell: bash
        # z-fuzz-infra (#138.3): the FAST pre-merge fuzz seed derives from
        # (base SHA, PR number) so every PR explores a FRESH but
        # REPRODUCIBLE stream instead of replaying the constant 20260930
        # stream forever after its first green. Non-PR runs fall back to
        # the head SHA.
        run: |
          SEED_SRC="${{ github.event.pull_request.base.sha || github.sha }}"
          SEED=$(( 16#${SEED_SRC:0:8} + ${{ github.event.number || 0 }} ))
          python3 scripts/fuzz_parser.py --n 500 --seed $((SEED % 1000000000)) --exec

      - name: Parser fuzzer (i686 calibrated wall)
        if: matrix.target == 'i686-unknown-linux-gnu'
        shell: bash
        # compat-r3 (z, PR #209 review): same seed, same contract — the WALL
        # is calibrated for the leg, exactly the windows TIMEOUT calibration
        # class (L-012). The PR-209 seed surfaced two class-S tree-walk
        # grinds measured 6.2s / 12.2s on the x86_64 release build (both
        # contained, rc=0; the 114-byte in_499 is the pathological slow
        # cousin of the #111 deep-nesting family — tracked as its own
        # issue). 15s tipped over on this leg's 32-bit codegen; 45s = 3x
        # the measured x64 worst. The engine contract (containment, rc,
        # panic text) is UNCHANGED — only the wall scales with hardware.
        env:
          FUZZ_TIMEOUT: "45"
        run: |
          SEED_SRC="${{ github.event.pull_request.base.sha || github.sha }}"
          SEED=$(( 16#${SEED_SRC:0:8} + ${{ github.event.number || 0 }} ))
          python3 scripts/fuzz_parser.py --n 500 --seed $((SEED % 1000000000)) --exec

      - name: Redteam containment
        if: matrix.profile == 'release' && !matrix.target
        shell: bash
        run: bash scripts/redteam.sh
