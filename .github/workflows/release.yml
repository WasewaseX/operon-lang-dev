name: operon-release

# T3: prebuilt binaries on every version tag.
# Package layout: operon-{version}-{os}-{arch}.(tar.gz|zip) containing the
# binary + README + LICENSE + TUTORIAL.md + std/ + examples/.
#
# Portability notes (t3c, after first release-matrix failures):
#   * x86_64-apple-darwin is CROSS-COMPILED on macos-latest (arm64) — the
#     macos-13 Intel runner label is retirement-bound and stuck this matrix
#     in "queued". Apple's toolchain links both arches from one SDK; the
#     proof-gate still runs host-native (same source, honest gate).
#   * Every build passes an explicit --target; binaries are picked up from
#     target/<triple>/release/, never from the host dir.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  pkg: tar }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, pkg: tar }
          - { os: macos-latest,     target: aarch64-apple-darwin,      pkg: tar }
          - { os: macos-latest,     target: x86_64-apple-darwin,       pkg: tar, cross: yes }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    pkg: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2 (SHA-pinned, sec-r1)

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (SHA-pinned, D-6/sec-r5)
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, declared target)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Proof suite gates the release (host-native)
        run: cargo test --release

      - name: Package (unix)
        if: matrix.pkg == 'tar'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          ST="operon-${V}-${{ matrix.target }}"
          mkdir -p "$ST"
          cp "target/${{ matrix.target }}/release/operon" "$ST/"
          # lsp-r1: hard-require the target's own operon-ls — the old
          # `|| cp target/release/operon-ls` fallback could ship a host-arch
          # binary that does not run on the target
          cp "target/${{ matrix.target }}/release/operon-ls" "$ST/"
          cp README.md LICENSE TUTORIAL.md "$ST/"
          cp -r std examples "$ST/"
          tar czf "$ST.tar.gz" "$ST"
          # macOS has no GNU coreutils sha256sum — fall back to shasum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ST.tar.gz" > "$ST.tar.gz.sha256"
          else
            shasum -a 256 "$ST.tar.gz" > "$ST.tar.gz.sha256"
          fi
          echo "ASSET=$ST.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          $V = "${env:GITHUB_REF_NAME}" -replace '^v',''
          $ST = "operon-$V-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $ST | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/operon.exe" $ST/
          # lsp-r1: Windows users get the language server too (it was missing
          # from the zip entirely — the editor story did not exist on Windows)
          Copy-Item "target/${{ matrix.target }}/release/operon-ls.exe" $ST/
          Copy-Item README.md, LICENSE, TUTORIAL.md $ST/
          Copy-Item -Recurse std, examples $ST/
          Compress-Archive -Path $ST -DestinationPath "$ST.zip"
          $h = (Get-FileHash "$ST.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $ST.zip" | Out-File -Encoding ascii "$ST.zip.sha256"
          "ASSET=$ST.zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (SHA-pinned, D-6/sec-r5)
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
